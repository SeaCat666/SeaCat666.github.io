name: twikoo-comments-backup

on:
  push:
    paths:
      - '.github/workflows/twikoo-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe backend
        run: |
          cat > probe.mjs <<'EOF'
          const ENV = 'https://twikoo-deepseacat.vercel.app';
          const call = async (body) => {
            const res = await fetch(ENV, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
            const text = await res.text();
            try { return { status: res.status, json: JSON.parse(text) }; } catch { return { status: res.status, text: text.slice(0, 400) }; }
          };
          const out = {};
          out.config = await call({ event: 'GET_CONFIG' });
          out.version = await call({ event: 'GET_FUNC_VERSION' });
          const urls = [
            '/guestbook/', '/guestbook', '/guestbook/index.html', '/',
            'https://www.deepseacat.cn/guestbook/', 'https://deepseacat.cn/guestbook/',
            'www.deepseacat.cn/guestbook/', '/message/', '/留言/', '/guestbook.html',
            '/posts/77770c79.html', '/2020/12/25/HelloWorld/', '/about/', '/link/',
          ];
          out.comments = {};
          for (const url of urls) {
            const r = await call({ event: 'COMMENT_GET', url, includeReply: true, pageSize: 200 });
            const d = r.json;
            out.comments[url] = r.status === 200 && d ? { count: d.count, more: d.more, dataLength: Array.isArray(d.data) ? d.data.length : null } : r;
            console.log(url, JSON.stringify(out.comments[url]));
          }
          // 顺手看看计数器/其他事件是否也全空
          out.count = await call({ event: 'COMMENT_COUNT', urls: urls });
          const fs = await import('node:fs/promises');
          await fs.writeFile('comments-raw.json', JSON.stringify(out, null, 2));
          console.log('config:', JSON.stringify(out.config).slice(0, 600));
          EOF
          node probe.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add comments-raw.json
          git commit -m 'chore: 复核 Twikoo 后端数据' || echo 'nothing to commit'
          git push
