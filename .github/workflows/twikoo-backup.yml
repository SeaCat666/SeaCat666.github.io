name: twikoo-comments-backup

on:
  push:
    paths:
      - '.github/workflows/twikoo-backup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dump one comment
        run: |
          cat > dump.mjs <<'EOF'
          const ENV = 'https://twikoo-deepseacat.vercel.app';
          const res = await fetch(ENV, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ event: 'COMMENT_GET', url: '/2020/12/25/HelloWorld/', includeReply: true, pageSize: 200 }),
          });
          const json = await res.json();
          const fs = await import('node:fs/promises');
          await fs.writeFile('comments-raw.json', JSON.stringify(json, null, 2));
          console.log(JSON.stringify(json).slice(0, 1500));
          EOF
          node dump.mjs
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add comments-raw.json
          git commit -m 'chore: 导出唯一一条老留言' || echo 'nothing to commit'
          git push
